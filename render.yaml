# Render Blueprint for the Outbox email scheduler demo.
#
# One apply creates Postgres, Redis (Key Value), the API + BullMQ worker, and
# the Next.js frontend. The API container runs migrations and the idempotent
# demo seed on boot, then starts the worker in the background.
#
# Free-tier note: web services sleep after 15 minutes of inactivity. Open the
# frontend URL a minute before your demo so it wakes up.

databases:
  - name: outbox-postgres
    databaseName: email_scheduler
    user: outbox
    plan: free
    region: oregon

services:
  - type: keyvalue
    name: outbox-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: [] # Private network only

  - type: web
    name: outbox-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    dockerCommand: /bin/sh -c "npx prisma migrate deploy && npm run db:seed && (node dist/queue/emailWorker.js &) && node dist/server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_USER_EMAIL
        value: demo@outbox.dev
      - key: DEMO_USER_NAME
        value: Oliver Brown
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: DATABASE_URL
        fromDatabase:
          name: outbox-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: outbox-redis
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: outbox-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: outbox-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SEARCH_ENABLED
        value: "false"
      - key: EMAIL_TRANSPORT
        value: smtp
      - key: WORKER_CONCURRENCY
        value: "3"
      - key: MIN_DELAY_BETWEEN_EMAILS_MS
        value: "2000"
      - key: DEFAULT_MAX_EMAILS_PER_HOUR_PER_SENDER
        value: "200"
      - key: LOG_LEVEL
        value: info

  - type: web
    name: outbox-web
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /
    envVars:
      # Runtime proxy target. The browser only talks to this Next.js origin.
      - key: BACKEND_URL
        fromService:
          type: web
          name: outbox-api
          envVarKey: RENDER_EXTERNAL_URL
